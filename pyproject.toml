[project]
name = "scam-autopsy-studio"
version = "0.1.0"
description = "Source-backed scam investigations and a cloud YouTube studio"
requires-python = ">=3.11,<3.13"
dependencies = [
  "google-api-python-client>=2.100,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "Pillow>=11,<13",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "kokoro==0.9.4",
  "torch>=2.6,<3",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scam_autopsy*"]
