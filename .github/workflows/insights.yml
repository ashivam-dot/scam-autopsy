name: Analytics and source research
on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      force_refill:
        description: 'Refill reviewed scripts now, subject to the eight-ready stock cap'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: scam-autopsy-state
  cancel-in-progress: false
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install lightweight research dependencies
        run: |
          uv export --locked --no-emit-project --no-dev --no-hashes \
            --output-file "$RUNNER_TEMP/insights-constraints.txt" > /dev/null
          uv venv --python 3.12 .insights-venv
          uv pip install --python .insights-venv/bin/python \
            --constraint "$RUNNER_TEMP/insights-constraints.txt" \
            google-api-python-client google-auth requests beautifulsoup4
          echo "$GITHUB_WORKSPACE/.insights-venv/bin" >> "$GITHUB_PATH"
      - name: Record analytics and evidence-limited growth decisions
        run: python -m scam_autopsy.cli stats
      - name: Decide bounded source refill
        id: refill
        if: always()
        env:
          FORCE_REFILL: ${{ inputs.force_refill }}
        run: python -m scam_autopsy.refill_decision
      - name: Refill reviewed scripts when due
        if: ${{ always() && steps.refill.outputs.refill == 'true' }}
        env:
          REFILL_LIMIT: ${{ steps.refill.outputs.limit }}
        run: python -m scam_autopsy.research --limit "$REFILL_LIMIT"
      - name: Save cloud state
        if: always()
        run: |
          git config user.name 'Scam Autopsy studio'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content state reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update channel insights and reviewed source queue'
            git push origin HEAD:main
          fi
      - name: Verify queue and cloud receipts
        if: always()
        run: python -m scam_autopsy.health
      - name: Save health receipt
        if: always()
        run: |
          if [ -f state/health.json ]; then
            git add state/health.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record cloud health verification'
              git push origin HEAD:main
            fi
          fi
      - name: Alert on a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue list --state open --search 'Channel insights require attention in:title' --json number --jq length)" = '0' ]; then
            gh issue create --title 'Channel insights require attention' --body "Run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
